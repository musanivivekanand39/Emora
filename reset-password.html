<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password | Emora</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-screen" style="visibility: visible">
      <section class="auth-card glass" aria-labelledby="reset-title">
        <h1 id="reset-title">Choose a new password</h1>
        <form class="auth-form" id="resetForm">
          <label><span>New password</span><input name="password" type="password" minlength="12" autocomplete="new-password" required /></label>
          <button class="primary-button" type="submit">Update password</button>
        </form>
        <p class="auth-status" id="status" role="status"></p>
      </section>
    </main>
    <script type="module">
      import { authApiUrl } from "./firebase-config.js";
      const form = document.querySelector("#resetForm");
      const status = document.querySelector("#status");
      const token = new URLSearchParams(location.search).get("token");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const response = await fetch(`${authApiUrl}/password-reset-confirm`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, password: new FormData(form).get("password") }) });
          if (!response.ok) throw new Error();
          status.textContent = "Password updated. You can now log in.";
          form.reset();
        } catch {
          status.textContent = "Invalid request.";
          status.classList.add("error");
        }
      });
    </script>
  </body>
</html>
